[project]
name = "bugbountybot"
version = "0.1.0"
description = "Local, single-user bug bounty agent: program tracking, scoped security testing, payload engine, evidence-backed reporting."
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "PyYAML>=6.0",
    "keyring>=25.0",
    "python-dotenv>=1.0",
    "fastapi>=0.111",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
bugbounty = "bugbountybot.cli.main:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bugbountybot*", "benchmark*"]

[tool.setuptools.package-data]
bugbountybot = ["py.typed"]
benchmark = ["fixtures/*.yaml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
