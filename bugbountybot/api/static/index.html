<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BugBounty Bot Pro</title>
  <style>
    :root {
      --bg: #0d1117; --surface: #161b22; --surface-2: #1c2128; --border: #30363d;
      --text: #e6edf3; --text-muted: #8b949e; --accent: #58a6ff; --accent-dim: #1f6feb33;
      --green: #3fb950; --green-dim: #23863633; --orange: #d29922; --orange-dim: #9e6a0333;
      --red: #f85149; --red-dim: #da363333; --purple: #a371f7;
      --sidebar-w: 220px; --radius: 8px;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --mono: "SF Mono", "Fira Code", Consolas, monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font); background: var(--bg); color: var(--text); display: flex; min-height: 100vh; line-height: 1.5; }

    .sidebar { width: var(--sidebar-w); background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; position: fixed; top: 0; bottom: 0; z-index: 10; }
    .logo { padding: 18px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; }
    .logo-icon { width: 32px; height: 32px; background: linear-gradient(135deg, var(--accent), var(--purple)); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 16px; }
    .logo-text { font-weight: 700; font-size: 14px; }
    .logo-text span { display: block; font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
    nav { padding: 12px 8px; flex: 1; }
    .nav-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: var(--radius); color: var(--text-muted); text-decoration: none; font-size: 14px; cursor: pointer; margin-bottom: 2px; transition: background 0.15s, color 0.15s; }
    .nav-item:hover { background: var(--surface-2); color: var(--text); }
    .nav-item.active { background: var(--accent-dim); color: var(--accent); }
    .nav-item .icon { width: 18px; text-align: center; }
    .sidebar-footer { padding: 14px 16px; border-top: 1px solid var(--border); font-size: 12px; color: var(--text-muted); }

    .main { margin-left: var(--sidebar-w); flex: 1; display: flex; flex-direction: column; }
    .topbar { padding: 16px 28px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; background: var(--surface); }
    .topbar h1 { font-size: 18px; font-weight: 600; }
    .topbar-actions { display: flex; gap: 10px; align-items: center; }
    .btn { padding: 8px 16px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--surface-2); color: var(--text); font-size: 13px; cursor: pointer; font-family: var(--font); transition: background 0.15s; }
    .btn:hover { background: var(--border); }
    .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
    .btn-primary:hover { opacity: 0.9; background: var(--accent); }
    .btn-sm { padding: 4px 10px; font-size: 12px; }

    .content { padding: 24px 28px; flex: 1; }
    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
    .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 20px; }
    .stat-label { font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
    .stat-value { font-size: 28px; font-weight: 700; }
    .stat-value.green { color: var(--green); }
    .stat-value.orange { color: var(--orange); }
    .stat-value.accent { color: var(--accent); }
    .stat-sub { font-size: 12px; color: var(--text-muted); margin-top: 4px; }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
    .panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
    .panel-header { padding: 14px 18px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; font-size: 14px; font-weight: 600; }
    .panel-header a { font-size: 12px; color: var(--accent); text-decoration: none; font-weight: 400; cursor: pointer; }
    .panel-body { padding: 0; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { text-align: left; padding: 10px 18px; color: var(--text-muted); font-weight: 500; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid var(--border); }
    td { padding: 12px 18px; border-bottom: 1px solid var(--border); }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: var(--surface-2); }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: 600; }
    .badge-critical { background: var(--red-dim); color: var(--red); }
    .badge-high { background: var(--orange-dim); color: var(--orange); }
    .badge-medium { background: var(--accent-dim); color: var(--accent); }
    .badge-low { background: var(--green-dim); color: var(--green); }
    .badge-info { background: var(--surface-2); color: var(--text-muted); }
    .badge-ok { background: var(--green-dim); color: var(--green); }
    .badge-block { background: var(--red-dim); color: var(--red); }

    .form-row { display: flex; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
    input, select, textarea { background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius); color: var(--text); padding: 8px 12px; font-size: 13px; font-family: var(--font); }
    input:focus, select:focus { outline: none; border-color: var(--accent); }
    input[type=text], input[type=url], input[type=number] { flex: 1; min-width: 140px; }
    textarea { width: 100%; min-height: 80px; font-family: var(--mono); font-size: 12px; }
    label { font-size: 12px; color: var(--text-muted); display: block; margin-bottom: 4px; }
    .muted { color: var(--text-muted); font-size: 12px; }
    .mono { font-family: var(--mono); font-size: 12px; word-break: break-all; }
    pre { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; overflow: auto; font-family: var(--mono); font-size: 12px; max-height: 400px; white-space: pre-wrap; }
    .toast { position: fixed; bottom: 20px; right: 20px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 18px; font-size: 13px; box-shadow: 0 4px 20px rgba(0,0,0,0.4); display: none; z-index: 100; }
    .toast.show { display: block; }
    .toast.ok { border-color: var(--green); }
    .toast.err { border-color: var(--red); }
    .hidden { display: none; }
    .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: none; align-items: center; justify-content: center; z-index: 50; }
    .modal-backdrop.show { display: flex; }
    .modal { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); width: 560px; max-width: 90vw; max-height: 85vh; overflow: auto; padding: 22px; }
    .modal h3 { margin-bottom: 14px; font-size: 16px; }
    .modal .form-row { align-items: flex-end; }
    .flex { display: flex; align-items: center; gap: 10px; }
    .check-row { display: flex; align-items: center; gap: 8px; font-size: 13px; margin-bottom: 10px; }
    .check-row input { width: auto; }
    .sev-critical { color: var(--red); }
    .sev-high { color: var(--orange); }
    .sev-medium { color: var(--accent); }
    .sev-low { color: var(--green); }
    .sev-info { color: var(--text-muted); }
  </style>
</head>
<body>
  <aside class="sidebar">
    <div class="logo">
      <div class="logo-icon">🛡</div>
      <div class="logo-text">BugBounty Bot<span>Pro</span></div>
    </div>
    <nav>
      <a class="nav-item active" data-view="dashboard" onclick="showView('dashboard')"><span class="icon">📊</span> Dashboard</a>
      <a class="nav-item" data-view="programs" onclick="showView('programs')"><span class="icon">🎯</span> Programs</a>
      <a class="nav-item" data-view="recon" onclick="showView('recon')"><span class="icon">🔭</span> Recon</a>
      <a class="nav-item" data-view="findings" onclick="showView('findings')"><span class="icon">🐞</span> Findings</a>
      <a class="nav-item" data-view="submissions" onclick="showView('submissions')"><span class="icon">📨</span> Submissions</a>
      <a class="nav-item" data-view="scan" onclick="showView('scan')"><span class="icon">🚀</span> Run Scan</a>
      <a class="nav-item" data-view="logic" onclick="showView('logic')"><span class="icon">🧠</span> Logic</a>
      <a class="nav-item" data-view="report" onclick="showView('report')"><span class="icon">📄</span> Report</a>
      <a class="nav-item" data-view="payloads" onclick="showView('payloads')"><span class="icon">🧩</span> Payloads</a>
      <a class="nav-item" data-view="audit" onclick="showView('audit')"><span class="icon">📜</span> Audit Log</a>
      <a class="nav-item" data-view="alerts" onclick="showView('alerts')"><span class="icon">🔔</span> Alerts <span id="alert-count"></span></a>
    </nav>
    <div class="sidebar-footer">localhost only · drafts only</div>
  </aside>

  <div class="main">
    <div class="topbar">
      <h1 id="page-title">Dashboard</h1>
      <div class="topbar-actions">
        <button class="btn" onclick="refreshAll()">↻ Refresh</button>
      </div>
    </div>
    <div class="content" id="view-root"></div>
  </div>

  <div class="modal-backdrop" id="modal" onclick="if(event.target===this) closeModal()">
    <div class="modal" id="modal-body"></div>
  </div>
  <div class="toast" id="toast"></div>

<script>
const API = '';
let meta = { modules: [], templates: [] };
let state = { programs: [], findings: [], audit: [], payloads: [], submissions: [] };

async function j(method, url, body) {
  const opts = { method, headers: {} };
  if (body) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
  const r = await fetch(API + url, opts);
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.detail || ('HTTP ' + r.status));
  return data;
}

function toast(msg, ok = true) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + (ok ? 'ok' : 'err');
  clearTimeout(t._h);
  t._h = setTimeout(() => t.className = 'toast', 3000);
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
}

function sevClass(s) { return 'sev-' + (s || 'info'); }
function badge(s) {
  const map = { critical:'badge-critical', high:'badge-high', medium:'badge-medium', low:'badge-low', info:'badge-info' };
  return `<span class="badge ${map[s] || 'badge-info'}">${esc(s)}</span>`;
}

function showView(v) {
  document.querySelectorAll('.nav-item').forEach(n => n.classList.toggle('active', n.dataset.view === v));
  const titles = { dashboard:'Dashboard', programs:'Programs', recon:'Recon', findings:'Findings', submissions:'Submissions', scan:'Run Scan', logic:'Business Logic', report:'Report', payloads:'Payload Library', audit:'Audit Log', alerts:'Alerts' };
  document.getElementById('page-title').textContent = titles[v] || 'Dashboard';
  const root = document.getElementById('view-root');
  root.innerHTML = '<div class="muted">Loading…</div>';
  ({ dashboard: renderDashboard, programs: renderPrograms, recon: renderRecon, findings: renderFindings, submissions: renderSubmissions, scan: renderScan, logic: renderLogic, report: renderReport, payloads: renderPayloads, audit: renderAudit, alerts: renderAlerts })[v]();
}

async function refreshAll() {
  await Promise.allSettled([loadMeta(), loadPrograms(), loadFindings(), loadAudit(), loadPayloads(), loadAllSubmissions(), loadAlerts(), loadLogicPlans(), loadSessions()]);
  showView(document.querySelector('.nav-item.active').dataset.view);
}

// ---------- loaders ----------
async function loadMeta() { meta = await j('GET', '/api/meta'); }
async function loadPrograms() { state.programs = await j('GET', '/api/programs'); }
async function loadFindings() { state.findings = await j('GET', '/api/findings'); }
async function loadAudit() { state.audit = await j('GET', '/api/audit?limit=60'); }
async function loadPayloads() { state.payloads = await j('GET', '/api/payloads'); }
async function loadAllSubmissions() { try { state.submissions = await j('GET', '/api/submissions'); } catch (e) { state.submissions = []; } }

// ---------- dashboard ----------
function renderDashboard() {
  const root = document.getElementById('view-root');
  const total = state.findings.length;
  const bySev = {};
  state.findings.forEach(f => bySev[f.severity] = (bySev[f.severity] || 0) + 1);
  const blocked = state.audit.filter(a => !a.allowed).length;
  const payloads = state.payloads.count || 0;

  root.innerHTML = `
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-label">Programs</div><div class="stat-value accent">${state.programs.length}</div><div class="stat-sub">tracked</div></div>
      <div class="stat-card"><div class="stat-label">Findings</div><div class="stat-value ${total ? 'orange' : ''}">${total}</div><div class="stat-sub">${bySev.high || 0} high · ${bySev.medium || 0} medium</div></div>
      <div class="stat-card"><div class="stat-label">Payloads</div><div class="stat-value green">${payloads}</div><div class="stat-sub">in library</div></div>
      <div class="stat-card"><div class="stat-label">Submissions</div><div class="stat-value ${(state.submissions || []).length ? 'accent' : ''}">${(state.submissions || []).length}</div><div class="stat-sub">${(state.submissions || []).filter(s => s.status === 'paid').length} paid</div></div>
      <div class="stat-card"><div class="stat-label">Blocks</div><div class="stat-value ${blocked ? 'red' : 'green'}">${blocked}</div><div class="stat-sub">scope-guard blocks</div></div>
    </div>
    <div class="grid-2">
      <div class="panel">
        <div class="panel-header">Recent Findings <a onclick="showView('findings')">view all →</a></div>
        <div class="panel-body">
          <table><tr><th>#</th><th>Title</th><th>Severity</th><th>Module</th></tr>
          ${state.findings.slice(0, 8).map(f => `
            <tr style="cursor:pointer" onclick="openFinding(${f.id})">
              <td class="muted">${f.id}</td><td>${esc(f.title)}</td><td>${badge(f.severity)}</td><td class="mono">${esc(f.module)}</td>
            </tr>`).join('') || '<tr><td colspan="4" class="muted">No findings yet — run a scan.</td></tr>'}
          </table>
        </div>
      </div>
      <div class="panel">
        <div class="panel-header">Programs <a onclick="showView('programs')">manage →</a></div>
        <div class="panel-body">
          <table><tr><th>Name</th><th>Platform</th><th>Findings</th></tr>
          ${state.programs.map(p => `<tr><td>${esc(p.name)}</td><td class="muted">${esc(p.platform) || '—'}</td><td>${p.findings}</td></tr>`).join('') || '<tr><td colspan="3" class="muted">Add a program to get started.</td></tr>'}
          </table>
        </div>
      </div>
    </div>`;
}

// ---------- programs ----------
function renderPrograms() {
  const root = document.getElementById('view-root');
  root.innerHTML = `
    <div class="flex" style="margin-bottom:16px">
      <button class="btn btn-primary" onclick="openAddProgram()">+ Add Program</button>
      <button class="btn" onclick="openImportProgram()">⇩ Import from Platform</button>
    </div>
    <div class="panel">
      <div class="panel-header">Programs</div>
      <div class="panel-body">
        <table>
          <tr><th>#</th><th>Name</th><th>Platform</th><th>Tiers</th><th>Scope Rules</th><th>Findings</th><th></th></tr>
          ${state.programs.map(p => `
            <tr>
              <td class="muted">${p.id}</td>
              <td><strong>${esc(p.name)}</strong></td>
              <td class="muted">${esc(p.platform) || '—'}</td>
              <td>${p.allowed_tiers.map(t => badge('T' + t)).join(' ')}</td>
              <td class="muted">${p.rules.length} rules</td>
              <td>${p.findings}</td>
              <td><button class="btn btn-sm" onclick="openProgram(${p.id})">Details</button></td>
            </tr>`).join('') || '<tr><td colspan="7" class="muted">No programs yet.</td></tr>'}
        </table>
      </div>
    </div>`;
}

function openAddProgram() {
  const body = document.getElementById('modal-body');
  body.innerHTML = `
    <h3>Add Program</h3>
    <div class="form-row"><div style="flex:1"><label>Name</label><input type="text" id="mp-name" placeholder="acme"></div></div>
    <div class="form-row"><div style="flex:1"><label>Platform</label><input type="text" id="mp-platform" placeholder="hackerone / bugcrowd"></div></div>
    <div class="form-row"><div style="flex:1"><label>URL</label><input type="url" id="mp-url" placeholder="https://..."></div></div>
    <div class="form-row"><div style="flex:1"><label>Allowed tiers (comma-separated)</label><input type="text" id="mp-tiers" value="1,2"></div></div>
    <div class="form-row"><button class="btn btn-primary" onclick="submitProgram()">Create</button><button class="btn" onclick="closeModal()">Cancel</button></div>`;
  openModal();
}

async function submitProgram() {
  try {
    const p = await j('POST', '/api/programs', {
      name: document.getElementById('mp-name').value.trim(),
      platform: document.getElementById('mp-platform').value.trim(),
      url: document.getElementById('mp-url').value.trim(),
      allowed_tiers: document.getElementById('mp-tiers').value.trim() || '1,2',
    });
    closeModal();
    await loadPrograms();
    renderPrograms();
    toast(`Program ${p.name} added`);
  } catch (e) { toast(e.message, false); }
}

function openImportProgram() {
  const body = document.getElementById('modal-body');
  body.innerHTML = `
    <h3>Import Program Scope</h3>
    <div class="form-row"><div style="flex:1"><label>Platform</label>
      <select id="imp-platform" onchange="toggleImportFields()">
        <option value="hackerone">HackerOne</option>
        <option value="bugcrowd">Bugcrowd</option>
        <option value="csv">CSV file</option>
      </select></div></div>
    <div id="imp-handle-row"><div class="form-row"><div style="flex:1"><label>Program handle / code</label>
      <input type="text" id="imp-handle" placeholder="acme"></div></div></div>
    <div id="imp-csv-row" class="hidden"><div class="form-row"><div style="flex:1"><label>CSV path (on this machine)</label>
      <input type="text" id="imp-csv" placeholder="/path/to/scope.csv"></div></div></div>
    <div class="form-row"><div style="flex:1"><label>Program name (optional)</label>
      <input type="text" id="imp-name" placeholder="acme"></div></div>
    <div class="form-row"><button class="btn btn-primary" onclick="submitImport()">Import</button>
      <button class="btn" onclick="closeModal()">Cancel</button></div>
    <div class="muted">HackerOne needs credentials: set HACKERONE_USERNAME / HACKERONE_API_TOKEN in .env, or run <span class="mono">bugbounty program credentials hackerone</span>.</div>`;
  toggleImportFields();
  openModal();
}

function toggleImportFields() {
  const platform = document.getElementById('imp-platform').value;
  document.getElementById('imp-handle-row').style.display = (platform === 'csv') ? 'none' : '';
  document.getElementById('imp-csv-row').style.display = (platform === 'csv') ? '' : 'none';
}

async function submitImport() {
  try {
    const r = await j('POST', '/api/import', {
      platform: document.getElementById('imp-platform').value,
      handle: document.getElementById('imp-handle').value.trim(),
      csv_file: document.getElementById('imp-csv').value.trim(),
      program_name: document.getElementById('imp-name').value.trim(),
    });
    closeModal();
    await loadPrograms();
    renderPrograms();
    toast(`Imported ${r.rules_added} scope rules for ${r.program_name}`);
  } catch (e) { toast(e.message, false); }
}

function openProgram(id) {
  const p = state.programs.find(x => x.id === id);
  if (!p) return;
  const body = document.getElementById('modal-body');
  body.innerHTML = `
    <h3>${esc(p.name)}</h3>
    <div class="muted" style="margin-bottom:14px">${esc(p.url) || 'no url'} · platform: ${esc(p.platform) || '—'}</div>
    <div class="form-row"><div style="flex:1"><label>Add scope rule</label><input type="text" id="ms-pattern" placeholder="*.acme.com / 10.0.0.0/8"></div>
      <div><label>Kind</label><select id="ms-kind"><option>domain</option><option>wildcard</option><option>ip</option><option>cidr</option></select></div>
      <div><label>In scope</label><select id="ms-inscope"><option value="true">yes</option><option value="false">no</option></select></div>
      <button class="btn btn-primary" onclick="submitScope(${p.id})">Add</button></div>
    <div class="form-row"><div style="flex:1"><label>Add endpoint (for scanning)</label><input type="url" id="ms-url" placeholder="https://api.acme.com/search"></div>
      <div><label>Params</label><input type="text" id="ms-params" placeholder="q,page"></div>
      <button class="btn" onclick="submitEndpoint(${p.id})">Add</button></div>
    <table style="margin-top:10px"><tr><th>Scope</th><th>Kind</th><th>Pattern</th></tr>
      ${p.rules.map(r => `<tr><td>${r.in_scope ? badge('in') : badge('out')}</td><td class="muted">${r.kind}</td><td class="mono">${esc(r.pattern)}</td></tr>`).join('')}
    </table>`;
  openModal();
}

async function submitScope(id) {
  try {
    const p = await j('POST', `/api/programs/${id}/scope`, {
      pattern: document.getElementById('ms-pattern').value.trim(),
      kind: document.getElementById('ms-kind').value,
      in_scope: document.getElementById('ms-inscope').value === 'true',
    });
    await loadPrograms();
    openProgram(id);
    toast(`Scope rule added to ${p.name}`);
  } catch (e) { toast(e.message, false); }
}

async function submitEndpoint(id) {
  try {
    await j('POST', `/api/programs/${id}/endpoints`, {
      url: document.getElementById('ms-url').value.trim(),
      params: document.getElementById('ms-params').value.trim(),
    });
    toast('Endpoint added');
  } catch (e) { toast(e.message, false); }
}

// ---------- findings ----------
function renderFindings() {
  const root = document.getElementById('view-root');
  const filter = state.findings;
  root.innerHTML = `
    <div class="flex" style="margin-bottom:16px">
      <select id="f-template" style="flex:none">
        ${meta.templates.map(t => `<option>${t}</option>`).join('')}
      </select>
      <button class="btn" onclick="generateReport()">Generate Report Draft</button>
    </div>
    <div class="panel">
      <div class="panel-header">Findings</div>
      <div class="panel-body">
        <table>
          <tr><th>#</th><th>Title</th><th>Severity</th><th>Module</th><th>Status</th><th>URL</th></tr>
          ${filter.map(f => `
            <tr style="cursor:pointer" onclick="openFinding(${f.id})">

async function updateFinding(id) {

  const program = document.getElementById('lg-program').value;
  if (!program) { toast('Select a program', false); return; }
  try {
    const plan = await j('POST', '/api/logic/plan', {
      program,
      category: document.getElementById('lg-category').value,
      target: document.getElementById('lg-target').value.trim(),
    });
    await loadLogicPlans();
    renderLogic();
    viewLogicPlan(plan.id);
    toast('Plan generated');
  } catch (e) { toast(e.message, false); }
}

function viewLogicPlan(id) {
  const p = logicPlans.find(x => x.id === id);
  if (!p) return;
  const body = document.getElementById('modal-body');
  body.innerHTML = `
    <h3>${esc(p.title)}</h3>
    <div class="muted" style="margin-bottom:10px">${esc(p.description)}</div>
    <table><tr><th>#</th><th>Method</th><th>URL</th><th>Expect</th><th>Result</th></tr>
      ${p.steps.map(s => `
        <tr>
          <td>${s.order + 1}</td><td class="mono">${esc(s.method)}</td>
          <td class="mono">${esc(s.url)}</td><td class="muted">${esc(s.expect)}</td>
          <td>${s.result_status ? '<span class="mono">HTTP ' + s.result_status + '</span> ' + esc(s.result_note || '') : '<span class="muted">not run</span>'}</td>
        </tr>`).join('')}
    </table>
    <div class="form-row" style="margin-top:14px">
      <button class="btn btn-primary" onclick="runLogicPlan(${p.id})">Run Plan</button>
      <button class="btn" onclick="closeModal()">Close</button>
    </div>`;
  openModal();
}

async function runLogicPlan(id) {
  try {
    const r = await j('POST', `/api/logic/plan/${id}/run`, { parallel: false });
    await loadLogicPlans();
    await loadFindings();
    toast(`Plan ran: ${r.executed} executed, ${r.blocked} blocked, ${r.findings_created} candidate finding(s)`);
    viewLogicPlan(id);
  } catch (e) { toast(e.message, false); }
}

// ---------- payloads ----------
function renderPayloads() {
  const root = document.getElementById('view-root');
  root.innerHTML = `
    <div class="flex" style="margin-bottom:16px">
      <input type="text" id="p-search" placeholder="search payloads… (alert, OR 1=1, etc)" style="max-width:360px">
      <button class="btn" onclick="searchPayloads()">Search</button>
    </div>
    <div class="panel">
      <div class="panel-header">Payload Library <span class="muted">(${state.payloads.count || 0} shown)</span></div>
      <div class="panel-body">
        <table><tr><th>ID</th><th>Category</th><th>Tier</th><th>Payload</th></tr>
        ${(state.payloads.payloads || []).map(p => `
          <tr><td class="mono muted">${esc(p.id)}</td><td>${esc(p.category)}</td><td>${badge('T' + p.tier)}</td><td class="mono">${esc(p.payload)}</td></tr>`).join('') || '<tr><td colspan="4" class="muted">No payloads.</td></tr>'}
        </table>
      </div>
    </div>`;
}

async function searchPayloads() {
  const q = document.getElementById('p-search').value.trim();
  try {
    const r = await j('GET', '/api/payloads?search=' + encodeURIComponent(q));
    state.payloads = r;
    renderPayloads();
  } catch (e) { toast(e.message, false); }
}

// ---------- audit ----------
function renderAudit() {
  const root = document.getElementById('view-root');
  root.innerHTML = `
    <div class="panel">
      <div class="panel-header">Audit Log <span class="muted">(append-only — every request)</span></div>
      <div class="panel-body">
        <table><tr><th>#</th><th>Result</th><th>Tier</th><th>URL</th><th>Hash</th><th>Reason</th></tr>
        ${state.audit.map(a => `
          <tr>
            <td class="muted">${a.id}</td>
            <td>${a.allowed ? badge('allow') : badge('block')}</td>
            <td>${a.tier}</td>
            <td class="mono">${esc(a.url)}</td>
            <td class="mono muted">${esc(a.payload_hash.slice(0, 8))}</td>
            <td class="muted">${esc(a.reason)}</td>
          </tr>`).join('') || '<tr><td colspan="6" class="muted">No audit entries yet.</td></tr>'}
        </table>
      </div>
    </div>`;
}

// ---------- modal helpers ----------
function openModal() { document.getElementById('modal').classList.add('show'); }
function closeModal() { document.getElementById('modal').classList.remove('show'); }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

// ---------- init ----------
(async function init() {
  await refreshAll();
})();
</script>
</body>
</html>
